<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALKZY · Game Artwork</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f5f1e8;font:15px system-ui;padding:22px}.wrap{max-width:560px;margin:5vh auto;background:#141b2b;border:1px solid #92723d;border-radius:18px;padding:22px}h1{font-size:20px;color:#f3ce72;margin:0 0 8px}p{color:#b9bfd0;font-size:13px;line-height:1.5}label{display:block;color:#d9bd7c;font-size:11px;font-weight:800;letter-spacing:1px;margin:17px 0 7px}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #49536b;background:#0b1221;color:#fff;font:inherit}button{margin-top:16px;background:#d9b65f;color:#201707;font-weight:900;border:0}button:disabled{opacity:.5}#status{margin-top:15px;white-space:pre-wrap;color:#e7d39c;font-size:13px}#preview{max-width:100%;max-height:260px;object-fit:contain;margin-top:14px;border-radius:8px;display:none}
</style></head>
<body><main class="wrap">
<h1>ROYAL GAME ARTWORK UPLOAD</h1><p>Founder sign-in required. Upload PNG or WebP artwork (maximum 15 MB). The server validates the image bytes and stores it in TALKZY game artwork storage.</p>
<section id="login">
<label>FOUNDER EMAIL</label><input id="email" type="email" autocomplete="username">
<label>FOUNDER PASSWORD</label><input id="password" type="password" autocomplete="current-password">
<button id="signIn">FOUNDER SIGN IN</button>
</section>
<section id="upload" hidden>
<label>SELECT GAME</label><select id="game">
<option value="royal-fruit-crown">Royal Fruit Crown</option><option value="thunder-king">Thunder King</option><option value="lucky-elephant">Lucky Elephant</option><option value="wild-kingdom">Wild Kingdom</option><option value="royal-77">Royal 77</option><option value="ruby-jackpot">Ruby Jackpot</option><option value="greedy-game-7">Greedy Game 7</option><option value="greedy-game-8">Greedy Game 8</option><option value="greedy-game-9">Greedy Game 9</option><option value="greedy-game-10">Greedy Game 10</option><option value="room-games">Room Games</option></select>
<label>ARTWORK TYPE</label><select id="screen"><option value="main">Main game panel</option><option value="result">Result panel</option><option value="icon">Game icon / DP</option></select>
<label>CHOOSE PNG OR WEBP</label><input id="file" type="file" accept="image/png,image/webp,.png,.webp">
<img id="preview" alt="Artwork preview"><button id="send">UPLOAD ARTWORK</button><button id="signOut" style="background:#29344a;color:#fff">SIGN OUT</button>
</section><div id="status" role="status"></div>
</main><script>
let ownerToken='';
const $=id=>document.getElementById(id);
function status(message){$('status').textContent=message}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign-in failed');ownerToken=d.token;$('login').hidden=true;$('upload').hidden=false;$('password').value='';status('Founder signed in. Choose the game and artwork type.')}catch(e){status(e.message)}finally{b.disabled=false}};
$('file').onchange=()=>{const f=$('file').files[0];const img=$('preview');if(!f){img.style.display='none';return}if(!['image/png','image/webp'].includes(f.type)||f.size>15*1024*1024){$('file').value='';img.style.display='none';status('Select a PNG or WebP image up to 15 MB.');return}img.src=URL.createObjectURL(f);img.style.display='block';status(f.name+' · '+Math.round(f.size/1024)+' KB')};
$('send').onclick=async()=>{const f=$('file').files[0];if(!f)return status('Choose an image first.');const b=$('send');b.disabled=true;try{const bytes=await f.arrayBuffer();const u=new Uint8Array(bytes);const png=u.length>=8&&[137,80,78,71,13,10,26,10].every((v,i)=>u[i]===v);const webp=u.length>=12&&String.fromCharCode(...u.slice(0,4))==='RIFF'&&String.fromCharCode(...u.slice(8,12))==='WEBP';const mime=png?'image/png':webp?'image/webp':'';if(!mime)throw Error('The selected file is not a valid PNG or WebP image.');const r=await fetch('/api/admin/game-artwork',{method:'POST',headers:{'authorization':'Bearer '+ownerToken,'content-type':mime,'x-artwork-game':$('game').value,'x-artwork-screen':$('screen').value},body:bytes});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');status('UPLOAD COMPLETE\n'+d.url+'\nSaved as '+d.path);$('file').value=''}catch(e){status(e.message)}finally{b.disabled=false}};
$('signOut').onclick=()=>{ownerToken='';$('upload').hidden=true;$('login').hidden=false;status('Signed out.')};
</script></body></html>
