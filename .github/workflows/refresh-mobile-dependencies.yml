name: Refresh mobile dependency lock

on:
  push:
    branches: [main]
    paths:
      - 'mobile/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-mobile-deps]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and lock mobile dependencies
        working-directory: mobile
        run: npm install --no-fund

      - name: Require no high-severity production vulnerabilities
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Commit the verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lock changes to commit."
          else
            git commit -m "chore(deps): lock safe mobile dependency patches [skip-mobile-deps]"
            git push origin HEAD:main
          fi
