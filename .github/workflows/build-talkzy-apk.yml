name: Build TALKZY Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-talkzy-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required Supabase app secrets
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing GitHub Actions secrets: EXPO_PUBLIC_SUPABASE_URL and/or EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            echo "Add them in repository Settings > Secrets and variables > Actions before running the APK workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-fund

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Audit JavaScript dependencies
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

      - name: Set Android versionCode from workflow run
        working-directory: mobile
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const a=JSON.parse(fs.readFileSync(p,'utf8')); a.expo.android.versionCode=Math.max(a.expo.android.versionCode,Number(process.env.GITHUB_RUN_NUMBER)); fs.writeFileSync(p,JSON.stringify(a,null,2)+'\\n'); console.log('Android versionCode:',a.expo.android.versionCode);"

      - name: Generate Android native project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_BASE_URL: https://talkzy2.onrender.com
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble standalone release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_BASE_URL: https://talkzy2.onrender.com
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TALKZY-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
