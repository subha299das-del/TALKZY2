name: TALKZY Android APK

on:
  # One-time validation trigger; restored to manual-only after dispatch.
  push:
    paths:
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        timeout-minutes: 10
        run: npm install --no-audit --no-fund

      - name: Diagnose Expo Android autolinking publications
        working-directory: mobile
        timeout-minutes: 5
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/talkzy-autolinking-android.json
          node -e 'const fs=require("fs"); const raw=fs.readFileSync("/tmp/talkzy-autolinking-android.json","utf8"); const c=JSON.parse(raw); for (const [i,m] of (c.modules||[]).entries()) { console.log(JSON.stringify({index:i,packageName:m.packageName,packageVersion:m.packageVersion,projects:m.projects},null,2)); }'

      - name: Build Android APK
        working-directory: mobile
        timeout-minutes: 30
        env:
          EXPO_PUBLIC_API_BASE_URL: https://talkzy2.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx expo prebuild --clean --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace --max-workers=2

      - name: Find generated APK
        run: |
          find mobile/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload TALKZY APK
        uses: actions/upload-artifact@v4
        with:
          name: TALKZY-APK
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
