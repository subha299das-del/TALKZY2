
name: TALKZY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Check Expo configuration
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://talkzy2.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo config --type public

      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://talkzy2.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx expo prebuild --clean --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find generated APK
        run: |
          find mobile/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload TALKZY APK
        uses: actions/upload-artifact@v4
        with:
          name: TALKZY-APK
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
